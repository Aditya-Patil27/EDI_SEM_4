<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MotorSense — 3D VUI Dashboard</title>
  <meta name="description" content="3D Vibration User Interface for MotorSense predictive maintenance." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    .vui-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 16px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .vui-full { grid-column: 1 / -1; }
    .vui-panel {
      background: var(--glass-bg, #1A1F2ECC);
      border: 1px solid var(--glass-border, rgba(255,255,255,0.06));
      border-radius: 12px;
      padding: 12px;
      position: relative;
      min-height: 320px;
    }
    .vui-panel h3 {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dim, #6B7280);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .vui-canvas-wrap {
      width: 100%;
      height: 300px;
      border-radius: 8px;
      overflow: hidden;
    }
    .vui-canvas-wrap canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    .vui-return {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: var(--glass-bg, #1A1F2ECC);
      border: 1px solid var(--glass-border, rgba(255,255,255,0.06));
      border-radius: 8px;
      color: var(--text-primary, #E8EDF5);
      text-decoration: none;
      font-size: 13px;
      margin: 12px 16px 0;
      transition: background 0.2s;
    }
    .vui-return:hover { background: rgba(255,255,255,0.08); }
    #gui-toggle {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 1000;
      background: var(--glass-bg, #1A1F2ECC);
      border: 1px solid var(--glass-border, rgba(255,255,255,0.06));
      color: var(--text-primary, #E8EDF5);
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 12px;
      backdrop-filter: blur(12px);
    }
    .dg.ac { z-index: 999 !important; }
    .vui-panel { will-change: transform; transform: translateZ(0); }
    .vui-canvas-wrap { will-change: transform; }
    .alert-bar {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.4);
      border-radius: 8px;
      animation: flicker 0.8s infinite;
      margin-bottom: 8px;
    }
    .alert-bar.active { display: flex; }
    .alert-bar-icon { font-size: 18px; color: #ef4444; }
    .alert-bar-text { font-size: 12px; font-weight: 700; color: #ef4444; letter-spacing: 0.3px; }
    #timeline-chart { width: 100% !important; height: 100% !important; }
    @media (max-width: 1024px) {
      .vui-layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .vui-layout { padding: 8px; gap: 10px; }
      .vui-panel { min-height: 240px; }
      .vui-canvas-wrap { height: 240px; }
      .vui-panel h3 { font-size: 11px; }
      .vui-return { font-size: 12px; padding: 6px 12px; margin: 8px 8px 0; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
      </svg>
    </div>
    <div>
      <h1 class="brand-name">MotorSense</h1>
      <p class="brand-sub">3D Vibration User Interface</p>
    </div>
  </div>
  <div class="header-status">
    <button class="theme-toggle" id="theme-toggle">Accessibility</button>
    <div class="status-pill" id="conn-pill">
      <span class="status-dot" id="conn-dot"></span>
      <span id="conn-text">Disconnected</span>
    </div>
    <div class="status-pill" id="anomaly-pill" style="display:none;">
      <span class="status-dot" id="anomaly-dot"></span>
      <span id="anomaly-text">OK</span>
    </div>
  </div>
</header>

<a href="/" class="vui-return">&larr; Return to Dashboard</a>

<div class="vui-layout">
  <div class="vui-panel">
    <h3>Radar — Spectral Overview</h3>
    <div class="vui-canvas-wrap" id="radar3d-container"></div>
  </div>

  <div class="vui-panel">
    <h3>Gauge — Instant RMS</h3>
    <div class="vui-canvas-wrap" id="gauge3d-container" style="height:300px;display:flex;align-items:center;justify-content:center;"></div>
  </div>

  <div class="vui-panel vui-full">
    <h3>Waterfall — Frequency Drift</h3>
    <div class="vui-canvas-wrap" id="waterfall3d-container" style="height:360px;"></div>
  </div>

  <div class="vui-panel vui-full" id="scatter-panel">
    <h3>3D Feature Space — PCA Embedding</h3>
    <div class="alert-bar" id="alert-bar">
      <span class="alert-bar-icon">&#9888;</span>
      <span class="alert-bar-text" id="alert-bar-text">ANOMALY DETECTED</span>
    </div>
    <div class="vui-canvas-wrap" id="scatter3d-container" style="height:360px;"></div>
  </div>

  <div class="vui-panel vui-full">
    <h3>Anomaly Score — Timeline</h3>
    <div class="vui-canvas-wrap" id="timeline-container" style="height:120px;"></div>
  </div>

  <div class="vui-panel vui-full">
    <h3>RMS Trend — 7 Days</h3>
    <div style="height:120px;">
      <canvas id="trend-chart"></canvas>
    </div>
    <div class="trend-meta" style="display:flex;gap:12px;padding:6px 0 0;font-size:11px;color:var(--text-dim,#6B7280);">
      <span>Slope: <strong id="trend-slope">—</strong></span>
      <span>Current RMS: <strong id="trend-current">—</strong></span>
      <span>Data: <strong id="trend-count">0</strong> points</span>
      <span id="trend-badge" style="display:none;font-size:11px;padding:2px 8px;border-radius:4px;"></span>
    </div>
  </div>
</div>

<button id="gui-toggle">Controls</button>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module" src="/static/3d/main.js"></script>
<script>
  const socket = io({ transports: ['websocket', 'polling'] })
  const connPill = document.getElementById('conn-pill')
  const connDot = document.getElementById('conn-dot')
  const connText = document.getElementById('conn-text')
  const anomalyPill = document.getElementById('anomaly-pill')
  const anomalyDot = document.getElementById('anomaly-dot')
  const anomalyText = document.getElementById('anomaly-text')
  const alertBar = document.getElementById('alert-bar')
  const alertBarText = document.getElementById('alert-bar-text')

  let audioCtx = null
  function playAlertBeep() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)()
      const osc = audioCtx.createOscillator()
      const gain = audioCtx.createGain()
      osc.connect(gain)
      gain.connect(audioCtx.destination)
      osc.frequency.value = 880
      osc.type = 'square'
      gain.gain.value = 0.15
      osc.start()
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3)
      osc.stop(audioCtx.currentTime + 0.3)
    } catch (e) { /* audio not supported */ }
  }

  let prevAnomaly = false

  socket.on('connect', () => {
    connPill.className = 'status-pill connected'
    connDot.className = 'status-dot green'
    connText.textContent = 'Connected'
  })
  socket.on('disconnect', () => {
    connPill.className = 'status-pill'
    connDot.className = 'status-dot'
    connText.textContent = 'Disconnected'
    anomalyPill.style.display = 'none'
  })

  socket.on('sensor_data', (data) => {
    const isAnom = data.is_anomaly
    const score = data.anomaly_score || 0

    if (isAnom) {
      anomalyPill.style.display = 'flex'
      anomalyDot.className = 'status-dot red'
      anomalyText.textContent = 'ANOMALY'
      alertBar.classList.add('active')
    } else {
      anomalyDot.className = 'status-dot green'
      anomalyText.textContent = 'OK'
      alertBar.classList.remove('active')
    }

    if (isAnom && !prevAnomaly) {
      playAlertBeep()
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('MotorSense Alert', { body: 'Anomaly detected in vibration data', icon: '/static/favicon.ico' })
      }
      if (data.trend_alert) {
        alertBarText.textContent = 'ANOMALY + TREND BREACH'
      } else {
        alertBarText.textContent = 'ANOMALY DETECTED'
      }
    }
    prevAnomaly = isAnom
  })

  if ('Notification' in window && Notification.permission !== 'denied' && Notification.permission !== 'granted') {
    Notification.requestPermission()
  }

  const themeToggle = document.getElementById('theme-toggle')
  if (themeToggle) {
    if (localStorage.getItem('motorsense-cb-mode') === '1') {
      document.documentElement.classList.add('cb-mode')
      themeToggle.textContent = 'Standard'
    }
    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('cb-mode')
      const on = document.documentElement.classList.contains('cb-mode')
      localStorage.setItem('motorsense-cb-mode', on ? '1' : '0')
      themeToggle.textContent = on ? 'Standard' : 'Accessibility'
    })
  }
</script>
</body>
</html>
